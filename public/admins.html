<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrateurs — Douala Discovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="b1"></span>
      <span class="b2"></span>
      <span class="b3"></span>
      <span class="b4"></span>
    </div>

    <header class="topbar">
      <div class="container nav">
        <div class="brand-wrap">
          <div class="brand-mark">D</div>
          <div>
            <div class="brand-name">Douala Discovery</div>
            <small>Super-admin</small>
          </div>
        </div>
        <nav>
          <a href="/">Accueil</a>
          <a href="/dashboard">Dashboard</a>
          <a href="/admins">Admins</a>
        </nav>
      </div>
    </header>

    <main class="container page admins-page">
      <section class="panel reveal" data-reveal-index="0">
        <h2>Créer un compte administrateur</h2>
        <form id="create-admin-form" class="admin-form">
          <label class="field">
            <span>Nom</span>
            <input type="text" id="new-nom" placeholder="Ex : Awa Mbarga" required />
          </label>
          <label class="field">
            <span>Email</span>
            <input type="email" id="new-email" placeholder="admin@exemple.cm" required />
          </label>
          <label class="field">
            <span>Mot de passe</span>
            <input type="password" id="new-password" placeholder="min. 6 caractères" required />
          </label>
          <button class="primary-btn" type="submit" id="create-admin-btn">Créer le compte</button>
          <p class="auth-error" id="create-error" hidden></p>
          <p class="auth-success" id="create-success" hidden></p>
        </form>
      </section>

      <section class="panel reveal" data-reveal-index="1">
        <h2>Comptes existants</h2>
        <div id="admin-list" class="table-wrap"></div>
      </section>
    </main>

    <script src="/ui.js"></script>
    <script src="/nav.js"></script>
    <script src="/admins.js"></script>
  </body>
</html>
